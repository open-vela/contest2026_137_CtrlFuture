name: Renode Regression Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [dev-ai-contest-2026]

jobs:
  renode-regression:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: contest2026_137_CtrlFuture

      - name: Checkout NuttX
        uses: actions/checkout@v4
        with:
          repository: open-vela/nuttx
          ref: dev-ai-contest-2026
          path: nuttx

      - name: Checkout Apps
        uses: actions/checkout@v4
        with:
          repository: open-vela/apps
          ref: dev-ai-contest-2026
          path: apps

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Python dependencies
        run: |
          pip install robotframework psutil

      - name: Install Renode source
        run: |
          git clone --depth 1 https://github.com/renode/renode.git renode

      - name: Setup symlinks
        run: |
          cd contest2026_137_CtrlFuture
          ln -sf ../../nuttx/arch/arm/src/stm32n6 arch/arm/stm32n6/src
          ln -sf ../../nuttx/arch/arm/include/stm32n6 arch/arm/stm32n6/include

      - name: Copy C# models to Renode source
        run: |
          cp contest2026_137_CtrlFuture/tests/renode/peripherals/*.cs \
             renode/src/Infrastructure/src/Emulator/Peripherals/Peripherals/Miscellaneous/ 2>/dev/null || true

      - name: Build Renode
        run: |
          cd renode
          ./build.sh --no-gui

      - name: Build NuttX nsh
        run: |
          cd contest2026_137_CtrlFuture
          ./build.sh vendor/openvela/boards/contest2026_137_board/configs/nsh -j8

      - name: Run Robot tests
        run: |
          mkdir -p contest2026_137_CtrlFuture/tests/renode/results
          renode/renode-test contest2026_137_CtrlFuture/tests/renode/tests/*.robot \
            --results contest2026_137_CtrlFuture/tests/renode/results/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-test-results
          path: contest2026_137_CtrlFuture/tests/renode/results/
