name: Renode Regression Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [dev-ai-contest-2026]
  workflow_dispatch:

jobs:
  renode-regression:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: contest2026_137_CtrlFuture

      - name: Checkout NuttX
        uses: actions/checkout@v4
        with:
          repository: open-vela/nuttx
          ref: dev-ai-contest-2026
          path: nuttx

      - name: Checkout Apps
        uses: actions/checkout@v4
        with:
          repository: open-vela/apps
          ref: dev-ai-contest-2026
          path: apps

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ARM toolchain and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          pip install robotframework==6.1 psutil

      - name: Install Renode source
        run: |
          git clone --recursive https://github.com/renode/renode.git renode
          cd renode && git checkout 40c62fb && git submodule update --init --recursive

      - name: Setup symlinks
        run: |
          # nuttx/arch/arm/src/stm32n6 -> workspace root (4 levels up)
          ln -sf ../../../../contest2026_137_CtrlFuture/arch/arm/stm32n6/src \
                nuttx/arch/arm/src/stm32n6
          # nuttx/arch/arm/include/stm32n6 -> workspace root (4 levels up)
          ln -sf ../../../../contest2026_137_CtrlFuture/arch/arm/stm32n6/include \
                nuttx/arch/arm/include/stm32n6
          # vendor/openvela/boards/contest2026_137_board -> workspace root (3 levels up)
          mkdir -p vendor/openvela/boards
          ln -sf ../../../contest2026_137_CtrlFuture/board/contest_board \
                vendor/openvela/boards/contest2026_137_board
          # packages/demos/contest2026_137_* -> workspace root (2 levels up)
          mkdir -p packages/demos
          ln -sf ../../contest2026_137_CtrlFuture/app/hello_app \
                packages/demos/contest2026_137_hello_app
          ln -sf ../../contest2026_137_CtrlFuture/app/edgesight \
                packages/demos/contest2026_137_edgesight
          # Verify all symlinks resolve
          ls nuttx/arch/arm/src/stm32n6/ >/dev/null
          ls nuttx/arch/arm/include/stm32n6/ >/dev/null
          ls vendor/openvela/boards/contest2026_137_board/ >/dev/null

      - name: Apply Kconfig patch for STM32N6
        run: |
          git -C nuttx apply \
            "$GITHUB_WORKSPACE/contest2026_137_CtrlFuture/arch/arm/stm32n6/kconfig-stm32n6.patch"

      - name: Build NuttX nsh
        run: |
          docker pull ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace/nuttx \
            ghcr.io/open-vela/openvela-ci-linux_from_apache-nuttx:latest \
            /bin/bash -c "
              ./tools/configure.sh ../contest2026_137_CtrlFuture/board/contest_board/configs/nsh
              make -j\$(nproc)
            "
          ls -la nuttx/nuttx

      - name: Copy C# models to Renode source
        run: |
          cp contest2026_137_CtrlFuture/tests/renode/peripherals/*.cs \
             renode/src/Infrastructure/src/Emulator/Peripherals/Peripherals/Miscellaneous/
          ls renode/src/Infrastructure/src/Emulator/Peripherals/Peripherals/Miscellaneous/STM32N6_*.cs

      - name: Build Renode
        run: |
          cd renode
          ./build.sh --no-gui

      - name: Run Robot tests
        env:
          NUTTX_ELF: ${{ github.workspace }}/nuttx/nuttx
        run: |
          mkdir -p contest2026_137_CtrlFuture/tests/renode/results
          renode/renode-test contest2026_137_CtrlFuture/tests/renode/tests/*.robot \
            --results contest2026_137_CtrlFuture/tests/renode/results/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renode-test-results
          path: contest2026_137_CtrlFuture/tests/renode/results/
